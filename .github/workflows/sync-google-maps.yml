name: Weekly Google Maps Profile & Photo Sync

on:
  schedule:
    # Every Monday at 09:42 UTC (~4:42am / 5:42am ET)
    - cron: "42 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-google-maps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Chrome for Testing
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Crawl latest Google Maps reviews, photos & live telemetry
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: node scripts/crawl-google-maps.mjs --weekly

      - name: Commit & push if new dispatches or telemetry updated
        id: commit_step
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/maps-index.json data/maps-reviews.json index.html llms.txt
            git commit -m "chore(maps): weekly Google Maps contributor & telemetry sync"
            git pull --rebase origin main
            git push origin main
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Cloudflare Workers Build
        if: steps.commit_step.outputs.pushed == 'true' && env.CLOUDFLARE_DEPLOY_HOOK_URL != ''
        env:
          CLOUDFLARE_DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          curl -fsSL -X POST "$CLOUDFLARE_DEPLOY_HOOK_URL"
